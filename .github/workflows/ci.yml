name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Lint and Formatting Validation
  # ============================================================================
  lint-and-format:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting and Formatting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Validate Formatting (Black)
        run: |
          black --check src tests

      - name: Validate Import Sorting (isort)
        run: |
          isort --profile black --check src tests

      - name: Lint Codebase (Flake8)
        run: |
          flake8 src tests

  # ============================================================================
  # 2. Unit Tests & Coverage
  # ============================================================================
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Run Unit Tests with Coverage
        env:
          OPENAI_API_KEY: "mock-openai-key-for-testing-purpose-only"
          MONGODB_ATLAS_CLUSTER_URI: "mongodb://127.0.0.1:27017"
          MONGODB_ATLAS_DB_NAME: "test_ci_db"
          FEATURE_FLAG_GUARDRAILS_ENABLED: "true"
          FEATURE_FLAG_SESSION_MEMORY_ENABLED: "true"
          FEATURE_FLAG_MCPSERVER_ENABLED: "false"
        run: |
          pytest tests/unit_tests -m "not integration" \
            --cov=mcp_rag_agent \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload Coverage Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Publish Test Summary
        if: always() && matrix.python-version == '3.11'
        run: |
          echo "### Unit Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Isolation**: Clean offline execution with mock credentials" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage artifact**: Saved as \`coverage-report-py3.11\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 3. API Contract and Route Tests
  # ============================================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Run FastAPI Route and Contract Tests
        env:
          OPENAI_API_KEY: "mock-openai-key-for-testing-purpose-only"
          MONGODB_ATLAS_CLUSTER_URI: "mongodb://127.0.0.1:27017"
          MONGODB_ATLAS_DB_NAME: "test_ci_db"
        run: |
          pytest tests/unit_tests/test_api.py -v

  # ============================================================================
  # 4. Build Validation (Docker & Python Package)
  # ============================================================================
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Container Images
        run: |
          docker compose build --parallel

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate Python Package Build (Wheel & SDist)
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
          ls -la dist/

  # ============================================================================
  # 5. Security & Dependency Checks
  # ============================================================================
  security-checks:
    name: Security & Vulnerability Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r src/ -ll -v

      - name: Audit Production Dependencies for Known CVEs
        run: |
          pip install -r requirements.txt
          pip-audit --desc
