<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
    <style>
        .box { rx: 8; stroke-width: 1.5; }
        .title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
        .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; }
        @media (prefers-color-scheme: dark) {
            .bg { fill: #0b0f19; }
            .node-start { fill: #1e1b4b; stroke: #6366f1; }
            .node-step { fill: #2e1065; stroke: #a855f7; }
            .node-eval { fill: #312e81; stroke: #818cf8; }
            .node-ok { fill: #064e3b; stroke: #10b981; }
            .node-retry { fill: #431407; stroke: #f97316; }
            .node-esc { fill: #450a0a; stroke: #ef4444; }
            .text-main { fill: #f9fafb; }
            .text-sub { fill: #9ca3af; }
            .arrow-line { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        }
        @media (prefers-color-scheme: light) {
            .bg { fill: #f8fafc; }
            .node-start { fill: #eef2ff; stroke: #4f46e5; }
            .node-step { fill: #faf5ff; stroke: #9333ea; }
            .node-eval { fill: #f5f3ff; stroke: #7c3aed; }
            .node-ok { fill: #ecfdf5; stroke: #059669; }
            .node-retry { fill: #fff7ed; stroke: #ea580c; }
            .node-esc { fill: #fef2f2; stroke: #dc2626; }
            .text-main { fill: #0f172a; }
            .text-sub { fill: #475569; }
            .arrow-line { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        }
    </style>
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
        </marker>
    </defs>
    <rect width="880" height="340" class="bg" rx="12" />

    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="800" class="text-main">Stateful Troubleshooting Runbook Engine</text>
    <text x="30" y="56" font-family="system-ui, sans-serif" font-size="12" font-weight="500" class="text-sub">Deterministic LangGraph StateGraph Subgraph: STEP → EVALUATE → BRANCH with persistent checkpointer</text>

    <!-- START -->
    <rect x="30" y="120" width="130" height="80" class="node-start box" />
    <text x="95" y="155" text-anchor="middle" class="title text-main">START</text>
    <text x="95" y="175" text-anchor="middle" class="subtitle text-sub">Runbook Selection</text>

    <!-- Arrow Start -> Step -->
    <line x1="160" y1="160" x2="215" y2="160" class="arrow-line" />

    <!-- STEP -->
    <rect x="220" y="120" width="150" height="80" class="node-step box" />
    <text x="295" y="150" text-anchor="middle" class="title text-main">STEP (Action)</text>
    <text x="295" y="170" text-anchor="middle" class="subtitle text-sub">Prompt / Diagnostic</text>
    <text x="295" y="186" text-anchor="middle" class="subtitle text-sub">UI Step Tracker</text>

    <!-- Arrow Step -> Evaluate -->
    <line x1="370" y1="160" x2="425" y2="160" class="arrow-line" />

    <!-- EVALUATE -->
    <rect x="430" y="110" width="160" height="100" class="node-eval box" />
    <text x="510" y="145" text-anchor="middle" class="title text-main">EVALUATE</text>
    <text x="510" y="165" text-anchor="middle" class="subtitle text-sub">Outcome Validation</text>
    <text x="510" y="181" text-anchor="middle" class="subtitle text-sub">Strict Graph Guard</text>
    <text x="510" y="197" text-anchor="middle" class="subtitle text-sub">(No LLM Hallucinations)</text>

    <!-- Branches -->
    <!-- 1. Next Step Loop -->
    <path d="M 510 110 L 510 80 L 295 80 L 295 120" class="arrow-line" />
    <text x="400" y="72" text-anchor="middle" class="subtitle text-sub" font-weight="600">NEXT STEP (Branch)</text>

    <!-- 2. Retry Loop -->
    <path d="M 510 210 L 510 250 L 295 250 L 295 200" class="arrow-line" />
    <text x="400" y="265" text-anchor="middle" class="subtitle text-sub" font-weight="600">RETRY (Max 2 Attempts)</text>

    <!-- 3. Resolved -->
    <path d="M 590 140 L 670 110" class="arrow-line" />
    <rect x="675" y="70" width="170" height="70" class="node-ok box" />
    <text x="760" y="102" text-anchor="middle" class="title text-main">RESOLVED</text>
    <text x="760" y="122" text-anchor="middle" class="subtitle text-sub">Self-Service Success</text>

    <!-- 4. Escalated -->
    <path d="M 590 180 L 670 210" class="arrow-line" />
    <rect x="675" y="180" width="170" height="70" class="node-esc box" />
    <text x="760" y="212" text-anchor="middle" class="title text-main">ESCALATED</text>
    <text x="760" y="232" text-anchor="middle" class="subtitle text-sub">Transfer to Tier 2/3 Queue</text>
</svg>
