<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
    <style>
        .box { rx: 8; stroke-width: 1.5; }
        .title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
        .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; }
        @media (prefers-color-scheme: dark) {
            .bg { fill: #0b0f19; }
            .node-query { fill: #1e1b4b; stroke: #6366f1; }
            .node-dense { fill: #172554; stroke: #3b82f6; }
            .node-lexical { fill: #0f2e2e; stroke: #14b8a6; }
            .node-rrf { fill: #312e81; stroke: #818cf8; }
            .node-filter { fill: #450a0a; stroke: #ef4444; }
            .node-llm { fill: #064e3b; stroke: #10b981; }
            .text-main { fill: #f9fafb; }
            .text-sub { fill: #9ca3af; }
            .arrow-line { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        }
        @media (prefers-color-scheme: light) {
            .bg { fill: #f8fafc; }
            .node-query { fill: #eef2ff; stroke: #4f46e5; }
            .node-dense { fill: #eff6ff; stroke: #2563eb; }
            .node-lexical { fill: #f0fdfa; stroke: #0d9488; }
            .node-rrf { fill: #f5f3ff; stroke: #7c3aed; }
            .node-filter { fill: #fef2f2; stroke: #dc2626; }
            .node-llm { fill: #ecfdf5; stroke: #059669; }
            .text-main { fill: #0f172a; }
            .text-sub { fill: #475569; }
            .arrow-line { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        }
    </style>
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
        </marker>
    </defs>
    <rect width="900" height="360" class="bg" rx="12" />

    <text x="30" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="800" class="text-main">Hybrid Retrieval Pipeline with Reciprocal Rank Fusion (RRF)</text>
    <text x="30" y="56" font-family="system-ui, sans-serif" font-size="12" font-weight="500" class="text-sub">Combines dense semantic vector embeddings and lexical BM25 search with pre-retrieval security access filtering</text>

    <!-- Query -->
    <rect x="30" y="130" width="130" height="80" class="node-query box" />
    <text x="95" y="165" text-anchor="middle" class="title text-main">User Query</text>
    <text x="95" y="185" text-anchor="middle" class="subtitle text-sub">Text Normalization</text>

    <!-- Split Arrows -->
    <path d="M 160 150 L 220 110" class="arrow-line" />
    <path d="M 160 190 L 220 230" class="arrow-line" />

    <!-- Branch 1: Dense Vector Search -->
    <rect x="225" y="70" width="180" height="80" class="node-dense box" />
    <text x="315" y="102" text-anchor="middle" class="title text-main">Dense Vector Search</text>
    <text x="315" y="122" text-anchor="middle" class="subtitle text-sub">OpenAI text-embedding-3</text>
    <text x="315" y="138" text-anchor="middle" class="subtitle text-sub">MongoDB Atlas Vector Index</text>

    <!-- Branch 2: Lexical BM25 Search -->
    <rect x="225" y="190" width="180" height="80" class="node-lexical box" />
    <text x="315" y="222" text-anchor="middle" class="title text-main">Lexical Full-Text Search</text>
    <text x="315" y="242" text-anchor="middle" class="subtitle text-sub">BM25 / MongoDB Text Search</text>
    <text x="315" y="258" text-anchor="middle" class="subtitle text-sub">Exact Error Codes &amp; Keywords</text>

    <!-- Join Arrows into RRF -->
    <path d="M 405 110 L 465 150" class="arrow-line" />
    <path d="M 405 230 L 465 190" class="arrow-line" />

    <!-- RRF Fusion -->
    <rect x="470" y="120" width="170" height="100" class="node-rrf box" />
    <text x="555" y="150" text-anchor="middle" class="title text-main">Reciprocal Rank Fusion</text>
    <text x="555" y="170" text-anchor="middle" class="subtitle text-sub" font-weight="600">RRF(d) = Σ w_i / (60 + r_i)</text>
    <text x="555" y="188" text-anchor="middle" class="subtitle text-sub">Deduplication &amp; Reranking</text>
    <text x="555" y="204" text-anchor="middle" class="subtitle text-sub">Top-K Selection</text>

    <!-- Arrow to Access Filter -->
    <line x1="640" y1="170" x2="685" y2="170" class="arrow-line" />

    <!-- Pre-Retrieval Access Filter -->
    <rect x="690" y="80" width="180" height="80" class="node-filter box" />
    <text x="780" y="112" text-anchor="middle" class="title text-main">RBAC Access Filter</text>
    <text x="780" y="132" text-anchor="middle" class="subtitle text-sub">Pre-Retrieval Enforced</text>
    <text x="780" y="148" text-anchor="middle" class="subtitle text-sub">Zero Leakage to LLM</text>

    <!-- Arrow to LLM Grounding -->
    <path d="M 780 160 L 780 200" class="arrow-line" />

    <rect x="690" y="200" width="180" height="80" class="node-llm box" />
    <text x="780" y="232" text-anchor="middle" class="title text-main">Grounded Synthesis</text>
    <text x="780" y="252" text-anchor="middle" class="subtitle text-sub">COSTAR Framework</text>
    <text x="780" y="268" text-anchor="middle" class="subtitle text-sub">Verified Citations</text>
</svg>
