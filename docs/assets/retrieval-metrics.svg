<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 504" width="100%" height="100%">
    <style>
        @media (prefers-color-scheme: dark) {
            .bg-card { fill: #0f172a !important; stroke: #334155 !important; }
            .title-text { fill: #f8fafc !important; }
            .subtitle-text { fill: #94a3b8 !important; }
            .label-text { fill: #e2e8f0 !important; }
            .bar-track { fill: #1e293b !important; }
            .val-text { fill: #38bdf8 !important; }
            .badge-bg { fill: #1e293b !important; stroke: #38bdf8 !important; }
            .badge-text { fill: #38bdf8 !important; }
        }
    </style>
    <!-- Background Card -->
    <rect x="2" y="2" width="746" height="500" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" class="bg-card" />
    
    <!-- Title & Header -->
    <text x="40" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a" class="title-text">Hybrid Retrieval & Policy Grounding Performance</text>
    <text x="40" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b" class="subtitle-text">Reciprocal Rank Fusion (RRF: Dense Vector + Lexical BM25, k=60) on enterprise policy corpus</text>
    
    <!-- Benchmark Verified Badge -->
    <rect x="550" y="32" width="160" height="28" rx="6" fill="#eff6ff" stroke="#6366f1" stroke-width="1" class="badge-bg" />
    <text x="630" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle" class="badge-text">✓ REAL BENCHMARK</text>
    
    <!-- Divider -->
    <line x1="40" y1="92" x2="710" y2="92" stroke="#e2e8f0" stroke-width="1" class="bar-track" />
    
    <!-- Bars -->
    
        <!-- Row 0: Recall@1 -->
        <g class="bar-row">
            <text x="40" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" class="label-text">Recall@1</text>
            <!-- Background Track -->
            <rect x="250" y="120" width="400" height="26" rx="6" fill="#f1f5f9" class="bar-track" />
            <!-- Active Fill -->
            <defs>
                <linearGradient id="grad_bar_0" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1.0" />
                </linearGradient>
            </defs>
            <rect x="250" y="120" width="388" height="26" rx="6" fill="url(#grad_bar_0)" />
            <!-- Value Text -->
            <text x="652" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a" class="val-text">0.9714</text>
        </g>
        
        <!-- Row 1: Recall@3 -->
        <g class="bar-row">
            <text x="40" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" class="label-text">Recall@3</text>
            <!-- Background Track -->
            <rect x="250" y="172" width="400" height="26" rx="6" fill="#f1f5f9" class="bar-track" />
            <!-- Active Fill -->
            <defs>
                <linearGradient id="grad_bar_1" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1.0" />
                </linearGradient>
            </defs>
            <rect x="250" y="172" width="400" height="26" rx="6" fill="url(#grad_bar_1)" />
            <!-- Value Text -->
            <text x="664" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a" class="val-text">1.0000</text>
        </g>
        
        <!-- Row 2: Recall@5 -->
        <g class="bar-row">
            <text x="40" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" class="label-text">Recall@5</text>
            <!-- Background Track -->
            <rect x="250" y="224" width="400" height="26" rx="6" fill="#f1f5f9" class="bar-track" />
            <!-- Active Fill -->
            <defs>
                <linearGradient id="grad_bar_2" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1.0" />
                </linearGradient>
            </defs>
            <rect x="250" y="224" width="400" height="26" rx="6" fill="url(#grad_bar_2)" />
            <!-- Value Text -->
            <text x="664" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a" class="val-text">1.0000</text>
        </g>
        
        <!-- Row 3: Precision@1 -->
        <g class="bar-row">
            <text x="40" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" class="label-text">Precision@1</text>
            <!-- Background Track -->
            <rect x="250" y="276" width="400" height="26" rx="6" fill="#f1f5f9" class="bar-track" />
            <!-- Active Fill -->
            <defs>
                <linearGradient id="grad_bar_3" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1.0" />
                </linearGradient>
            </defs>
            <rect x="250" y="276" width="400" height="26" rx="6" fill="url(#grad_bar_3)" />
            <!-- Value Text -->
            <text x="664" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a" class="val-text">1.0000</text>
        </g>
        
        <!-- Row 4: Precision@3 -->
        <g class="bar-row">
            <text x="40" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" class="label-text">Precision@3</text>
            <!-- Background Track -->
            <rect x="250" y="328" width="400" height="26" rx="6" fill="#f1f5f9" class="bar-track" />
            <!-- Active Fill -->
            <defs>
                <linearGradient id="grad_bar_4" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1.0" />
                </linearGradient>
            </defs>
            <rect x="250" y="328" width="311" height="26" rx="6" fill="url(#grad_bar_4)" />
            <!-- Value Text -->
            <text x="575" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a" class="val-text">0.7778</text>
        </g>
        
        <!-- Row 5: MRR (Mean Recip. Rank) -->
        <g class="bar-row">
            <text x="40" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" class="label-text">MRR (Mean Recip. Rank)</text>
            <!-- Background Track -->
            <rect x="250" y="380" width="400" height="26" rx="6" fill="#f1f5f9" class="bar-track" />
            <!-- Active Fill -->
            <defs>
                <linearGradient id="grad_bar_5" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1.0" />
                </linearGradient>
            </defs>
            <rect x="250" y="380" width="400" height="26" rx="6" fill="url(#grad_bar_5)" />
            <!-- Value Text -->
            <text x="664" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a" class="val-text">1.0000</text>
        </g>
        
        <!-- Row 6: Hit Rate@3 -->
        <g class="bar-row">
            <text x="40" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" class="label-text">Hit Rate@3</text>
            <!-- Background Track -->
            <rect x="250" y="432" width="400" height="26" rx="6" fill="#f1f5f9" class="bar-track" />
            <!-- Active Fill -->
            <defs>
                <linearGradient id="grad_bar_6" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1.0" />
                </linearGradient>
            </defs>
            <rect x="250" y="432" width="400" height="26" rx="6" fill="url(#grad_bar_6)" />
            <!-- Value Text -->
            <text x="664" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a" class="val-text">1.0000</text>
        </g>
        
</svg>
