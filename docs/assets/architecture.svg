<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
    <style>
        .box { rx: 8; stroke-width: 1.5; }
        .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
        .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; }
        .arrow { stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrowhead); }
        .arrow-solid { stroke-width: 2; fill: none; marker-end: url(#arrowhead-solid); }
        @media (prefers-color-scheme: dark) {
            .bg { fill: #0b0f19; }
            .card-bg { fill: #111827; stroke: #374151; }
            .box-user { fill: #1e1b4b; stroke: #6366f1; }
            .box-api { fill: #0f2e2e; stroke: #14b8a6; }
            .box-agent { fill: #1e1b4b; stroke: #818cf8; }
            .box-rag { fill: #1e293b; stroke: #38bdf8; }
            .box-runbook { fill: #2e1065; stroke: #a855f7; }
            .box-mcp { fill: #312e81; stroke: #6366f1; }
            .box-db { fill: #064e3b; stroke: #10b981; }
            .box-sec { fill: #450a0a; stroke: #ef4444; }
            .box-eval { fill: #431407; stroke: #f97316; }
            .text-main { fill: #f9fafb; }
            .text-sub { fill: #9ca3af; }
            .arrow-line { stroke: #6b7280; }
        }
        @media (prefers-color-scheme: light) {
            .bg { fill: #f8fafc; }
            .card-bg { fill: #ffffff; stroke: #e2e8f0; }
            .box-user { fill: #eef2ff; stroke: #4f46e5; }
            .box-api { fill: #f0fdfa; stroke: #0d9488; }
            .box-agent { fill: #f5f3ff; stroke: #7c3aed; }
            .box-rag { fill: #f0f9ff; stroke: #0284c7; }
            .box-runbook { fill: #faf5ff; stroke: #9333ea; }
            .box-mcp { fill: #eef2ff; stroke: #4338ca; }
            .box-db { fill: #ecfdf5; stroke: #059669; }
            .box-sec { fill: #fef2f2; stroke: #dc2626; }
            .box-eval { fill: #fff7ed; stroke: #ea580c; }
            .text-main { fill: #0f172a; }
            .text-sub { fill: #475569; }
            .arrow-line { stroke: #94a3b8; }
        }
    </style>
    
    <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
        </marker>
        <marker id="arrowhead-solid" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f46e5" />
        </marker>
    </defs>

    <rect width="900" height="620" class="bg" rx="12" />

    <!-- Title Bar -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="800" class="text-main">IT Operations &amp; Support Copilot — System Architecture</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="500" class="text-sub">Hybrid RAG + Stateful Troubleshooting Runbooks + MCP Operations Tooling + RBAC / HITL Security</text>

    <!-- Top: Client Layer -->
    <g transform="translate(30, 80)">
        <rect width="840" height="70" class="card-bg box" />
        <text x="20" y="28" class="title text-main">Presentation &amp; Client Layer</text>
        <rect x="220" y="15" width="180" height="40" class="box-user box" />
        <text x="310" y="38" text-anchor="middle" class="title text-main" font-size="13">Employee Chat UI</text>
        <rect x="420" y="15" width="200" height="40" class="box-user box" />
        <text x="520" y="38" text-anchor="middle" class="title text-main" font-size="13">Runbook Step Widget</text>
        <rect x="640" y="15" width="180" height="40" class="box-user box" />
        <text x="730" y="38" text-anchor="middle" class="title text-main" font-size="13">Admin Operations UI</text>
    </g>

    <!-- Gateway Layer: FastAPI & RBAC -->
    <g transform="translate(30, 175)">
        <rect width="840" height="70" class="box-api box" />
        <text x="30" y="32" class="title text-main">FastAPI REST Gateway</text>
        <text x="30" y="52" class="subtitle text-sub">/api/v1/chat  |  /api/v1/it/tickets  |  /api/v1/admin/*</text>
        <rect x="480" y="15" width="340" height="40" class="box-sec box" />
        <text x="650" y="38" text-anchor="middle" class="title text-main" font-size="13">RBAC + Authorization Service (5 Roles)</text>
    </g>

    <!-- Core Orchestration: LangGraph Agent -->
    <g transform="translate(30, 270)">
        <rect width="840" height="155" class="box-agent box" />
        <text x="20" y="28" class="title text-main">LangGraph IT Support Agent Orchestrator</text>
        <text x="20" y="46" class="subtitle text-sub">COSTAR System Prompt • Deterministic Intent Routing • ReAct Decision Loop</text>
        
        <!-- 3 Subsystems inside Agent -->
        <!-- RAG Subsystem -->
        <rect x="20" y="60" width="255" height="80" class="box-rag box" />
        <text x="147" y="86" text-anchor="middle" class="title text-main" font-size="13">Hybrid RAG Engine</text>
        <text x="147" y="105" text-anchor="middle" class="subtitle text-sub">Dense Vector + Lexical BM25</text>
        <text x="147" y="123" text-anchor="middle" class="subtitle text-sub">Reciprocal Rank Fusion (k=60)</text>

        <!-- Runbook Subsystem -->
        <rect x="292" y="60" width="255" height="80" class="box-runbook box" />
        <text x="420" y="86" text-anchor="middle" class="title text-main" font-size="13">Runbook State Machine</text>
        <text x="420" y="105" text-anchor="middle" class="subtitle text-sub">10 Deterministic IT Runbooks</text>
        <text x="420" y="123" text-anchor="middle" class="subtitle text-sub">STEP → EVALUATE → BRANCH</text>

        <!-- MCP Tool Layer -->
        <rect x="565" y="60" width="255" height="80" class="box-mcp box" />
        <text x="692" y="86" text-anchor="middle" class="title text-main" font-size="13">MCP IT Operations Tools</text>
        <text x="692" y="105" text-anchor="middle" class="subtitle text-sub">5 FastMCP &amp; Direct Tools</text>
        <text x="692" y="123" text-anchor="middle" class="subtitle text-sub">User • Device • Service • Tickets</text>
    </g>

    <!-- Persistence & Cross-Cutting Layer -->
    <g transform="translate(30, 450)">
        <rect width="840" height="140" class="card-bg box" />
        
        <!-- MongoDB Atlas -->
        <rect x="20" y="20" width="255" height="100" class="box-db box" />
        <text x="147" y="48" text-anchor="middle" class="title text-main" font-size="13">MongoDB Atlas Cluster</text>
        <text x="147" y="68" text-anchor="middle" class="subtitle text-sub">• Vector Search Index</text>
        <text x="147" y="86" text-anchor="middle" class="subtitle text-sub">• Checkpointer (MongoDBSaver)</text>
        <text x="147" y="104" text-anchor="middle" class="subtitle text-sub">• Tickets / Incidents / Users / Audit</text>

        <!-- Security & HITL -->
        <rect x="292" y="20" width="255" height="100" class="box-sec box" />
        <text x="420" y="48" text-anchor="middle" class="title text-main" font-size="13">Security &amp; HITL Approval</text>
        <text x="420" y="68" text-anchor="middle" class="subtitle text-sub">• Risk Classifier (4 Tiers)</text>
        <text x="420" y="86" text-anchor="middle" class="subtitle text-sub">• Separation of Duties Engine</text>
        <text x="420" y="104" text-anchor="middle" class="subtitle text-sub">• Structured Redacted Audit Log</text>

        <!-- Evaluation & Observability -->
        <rect x="565" y="20" width="255" height="100" class="box-eval box" />
        <text x="692" y="48" text-anchor="middle" class="title text-main" font-size="13">Evaluation &amp; Observability</text>
        <text x="692" y="68" text-anchor="middle" class="subtitle text-sub">• 105 IT Benchmark Scenarios</text>
        <text x="692" y="86" text-anchor="middle" class="subtitle text-sub">• 12 IT Metrics + RAGAS Bundle</text>
        <text x="692" y="104" text-anchor="middle" class="subtitle text-sub">• Zero Cherry-Picking Regressions</text>
    </g>
</svg>
